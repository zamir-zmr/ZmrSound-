<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Audio Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #121212; color: #fff;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .player-card {
            background-color: #1e1e1e; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; text-align: center;
        }
        .song-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #4caf50; word-break: break-all; }
        .progress-container { width: 100%; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background-color: #444; border-radius: 5px; outline: none; cursor: pointer; accent-color: #4caf50; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; color: #bbb; margin-top: 6px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .btn { background-color: #333; color: #fff; border: none; padding: 10px 16px; border-radius: 50px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #555; }
        .play-btn { background-color: #4caf50; color: #fff; padding: 12px 24px; font-size: 16px; }
        .play-btn:hover { background-color: #45a049; }
        .status { font-size: 12px; color: #ff8080; margin-top: 12px; min-height: 16px; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="song-title">sorry sorry</div>

        <!-- File isi "zamir mp3" folder me honi chahiye, naam bilkul same -->
        <audio id="myAudio" src="abcd _sorrysorry.mp3" preload="auto"></audio>

        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" step="0.1">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="skip(-5)">-5s ⏪</button>
            <button class="btn play-btn" id="playBtn" onclick="togglePlay()">Play ▶</button>
            <button class="btn" onclick="skip(5)">⏩ +5s</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeElem = document.getElementById('currentTime');
        const durationElem = document.getElementById('duration');
        const statusElem = document.getElementById('status');

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerText = "Pause ⏸";
                    statusElem.innerText = "";
                }).catch(() => {
                    statusElem.innerText = "Play nahi ho paya: HTML file bhi 'zamir mp3' folder me hi honi chahiye, filename bilkul same ho.";
                });
            } else {
                audio.pause();
                playBtn.innerText = "Play ▶";
            }
        }

        function skip(seconds) {
            audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));
        }

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration) && audio.duration > 0) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeElem.innerText = formatTime(audio.currentTime);
                durationElem.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => { playBtn.innerText = "Play ▶"; });
        audio.addEventListener('error', () => {
            statusElem.innerText = "File nahi mili. Confirm karein: yeh HTML file usi 'zamir mp3' folder me hai jaha MP3 hai.";
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
        });

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            if (sec < 10) sec = `0${sec}`;
            return `${min}:${sec}`;
        }
    </script>

</body>
</html>
